<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Escobedo’s experiments with Claude Code</title>
<meta name="description" content="Things John Escobedo made for the browser: text adventures, election maps, karaoke listings, lessons and tools.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1533;
    --ink-raised: #2a2249;
    --paper: #f6f1e7;
    --quiet: #bdb5d3;
    --unsung: #6f6596;
    --lyric: #ffd84d;
    --display: "Bricolage Grotesque", "Segoe UI", sans-serif;
    --body: "Atkinson Hyperlegible", Verdana, sans-serif;
    --gutter: clamp(1.25rem, 5vw, 4.5rem);
  }

  * { box-sizing: border-box; margin: 0; }

  html { background: var(--ink); }

  body {
    background: var(--ink);
    color: var(--paper);
    font: 400 1.0625rem/1.55 var(--body);
    min-height: 100vh;
  }

  a { color: inherit; }

  a:focus-visible {
    outline: 3px solid var(--lyric);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .page {
    max-width: 82rem;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  /* Opening: the sentence lights up once, word by word, like a karaoke lyric */
  .opening {
    padding: clamp(3.5rem, 11vh, 7.5rem) 0 clamp(3rem, 8vh, 5.5rem);
  }

  .lyric {
    font: 800 clamp(2.5rem, 7.2vw, 6rem)/1.02 var(--display);
    letter-spacing: -0.03em;
    max-width: 15em;
    color: var(--lyric);
  }

  .lyric .word {
    display: inline-block;
    color: transparent;
    background: linear-gradient(90deg, var(--lyric) 50%, var(--unsung) 50%) 100% 0 / 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: sing var(--dur) linear var(--at) forwards;
    /* Keeps descenders inside the clipped background */
    padding-bottom: 0.14em;
    margin-bottom: -0.14em;
  }

  @keyframes sing { to { background-position: 0 0; } }

  .intro {
    margin-top: clamp(1.5rem, 4vh, 2.5rem);
    max-width: 38rem;
    font-size: clamp(1.0625rem, 1.5vw, 1.25rem);
    color: var(--quiet);
  }

  .contact {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.75rem;
    margin-top: 1.5rem;
    padding: 0;
    list-style: none;
    font-weight: 700;
  }

  .contact a {
    text-decoration: underline;
    text-decoration-color: var(--lyric);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.25em;
  }

  .contact a:hover { color: var(--lyric); }

  /* Top projects: a swipeable row, with the next project peeking in at the edge */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .top-bar h2 {
    font: 800 clamp(2rem, 4vw, 3.25rem)/1.05 var(--display);
    letter-spacing: -0.025em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
  }

  .controls button {
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--lyric);
    color: var(--ink);
    cursor: pointer;
  }

  .controls button:hover:not(:disabled) { background: var(--paper); }

  .controls button:focus-visible {
    outline: 3px solid var(--paper);
    outline-offset: 3px;
  }

  .controls button:disabled {
    background: var(--ink-raised);
    color: var(--unsung);
    cursor: default;
  }

  .controls span {
    min-width: 3.25em;
    text-align: center;
    color: var(--quiet);
    font-size: 0.9375rem;
    font-variant-numeric: tabular-nums;
  }

  .featured {
    --slide: min(78%, 46rem);
    --gap: clamp(1rem, 2.5vw, 2rem);
    position: relative;
    display: flex;
    gap: var(--gap);
    margin-right: calc(-1 * var(--gutter));
    padding: 0;
    list-style: none;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .featured::-webkit-scrollbar { display: none; }

  /* Lets the last project snap to the left edge like the others */
  .featured::after {
    content: "";
    flex: 0 0 calc(100% - var(--slide) - var(--gap));
  }

  .piece {
    flex: 0 0 var(--slide);
    scroll-snap-align: start;
  }

  .piece > a {
    display: block;
    text-decoration: none;
  }

  /* The row clips anything outside it, so focus and hover rings sit inside the edge */
  .piece > a:focus-visible { outline-offset: -3px; }

  .shot {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    object-position: top;
    background: var(--ink-raised);
    outline: 1px solid rgba(246, 241, 231, 0.14);
    outline-offset: -1px;
  }

  .piece > a:hover .shot {
    outline: 3px solid var(--lyric);
    outline-offset: -3px;
  }

  .piece h3 {
    margin-top: 1rem;
    font: 800 clamp(1.5rem, 2.6vw, 2.25rem)/1.1 var(--display);
    letter-spacing: -0.02em;
  }

  .piece > a:hover h3 { color: var(--lyric); }

  .piece p {
    margin-top: 0.5rem;
    max-width: 36rem;
    color: var(--quiet);
  }

  .piece .tech {
    margin-top: 0.5rem;
    font-size: 0.9375rem;
    font-style: italic;
  }

  /* Everything else: a plain songbook-style index */
  .more {
    margin-top: clamp(5rem, 11vw, 9rem);
    padding-bottom: clamp(4rem, 9vw, 7rem);
  }

  .more > h2 {
    font: 800 clamp(2rem, 4vw, 3.25rem)/1.05 var(--display);
    letter-spacing: -0.025em;
    margin-bottom: clamp(2rem, 4vw, 3rem);
  }

  .index {
    columns: 3 20rem;
    column-gap: clamp(2rem, 4vw, 3.5rem);
  }

  .group {
    break-inside: avoid;
    margin-bottom: 2.5rem;
  }

  .group h3 {
    font: 800 1.1875rem/1.2 var(--display);
    color: var(--lyric);
    margin-bottom: 0.5rem;
  }

  .group ul { padding: 0; list-style: none; }

  .group li { padding: 0.4rem 0; }

  .group a {
    font-weight: 700;
    text-underline-offset: 0.2em;
    text-decoration-color: var(--unsung);
  }

  .group a:hover {
    color: var(--lyric);
    text-decoration-color: var(--lyric);
  }

  .group span {
    display: block;
    font-size: 0.9375rem;
    line-height: 1.35;
    color: var(--quiet);
  }

  .notice { color: var(--quiet); padding-bottom: 4rem; }

  @media (max-width: 760px) {
    .featured { --slide: 86%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .featured { scroll-behavior: auto; }

    .lyric .word {
      animation: none;
      background: none;
      color: var(--lyric);
    }
  }
</style>
</head>
<body>

<div class="page">
  <header class="opening">
    <h1 class="lyric" id="lyric">John Escobedo’s experiments with Claude Code</h1>
    <p class="intro">Text adventures, election maps, karaoke listings, a guide to finding ASL learning resources and a calculator that only speaks Roman numerals. Most of it was built in conversation with Claude Code.</p>
    <ul class="contact">
      <li><a href="https://johnesco.github.io/resume/">Read my resume</a></li>
    </ul>
  </header>

  <main>
    <section class="top" id="top" aria-roledescription="carousel" aria-labelledby="top-heading" hidden>
      <div class="top-bar">
        <h2 id="top-heading">Top projects</h2>
        <div class="controls">
          <button type="button" id="prev" aria-label="Previous project">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg>
          </button>
          <span id="count" aria-live="polite"></span>
          <button type="button" id="next" aria-label="Next project">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <ul class="featured" id="featured"></ul>
    </section>
    <section class="more" id="more" hidden>
      <h2>More to try</h2>
      <div class="index" id="index"></div>
    </section>
    <p class="notice" id="notice" hidden></p>
    <noscript><p class="notice">This list needs JavaScript. You can also browse the projects on <a href="https://github.com/Johnesco?tab=repositories">GitHub</a>.</p></noscript>
  </main>
</div>

<script>
  // Split the headline into words and time the karaoke sweep to each word's length.
  (function () {
    var lyric = document.getElementById('lyric');
    var at = 0.25;
    var words = lyric.textContent.split(' ');
    lyric.setAttribute('aria-label', lyric.textContent);
    lyric.textContent = '';
    words.forEach(function (text, i) {
      var word = document.createElement('span');
      var dur = 0.09 + text.length * 0.03;
      word.className = 'word';
      word.setAttribute('aria-hidden', 'true');
      word.textContent = text;
      word.style.setProperty('--at', at.toFixed(2) + 's');
      word.style.setProperty('--dur', dur.toFixed(2) + 's');
      at += dur + 0.03;
      lyric.appendChild(word);
      if (i < words.length - 1) lyric.appendChild(document.createTextNode(' '));
    });
  })();

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function renderFeatured(project) {
    var item = el('li', 'piece');
    var link = el('a');
    link.href = project.url;
    if (project.image) {
      var shot = el('img', 'shot');
      shot.src = project.image;
      shot.alt = '';
      shot.loading = 'lazy';
      shot.width = 1000;
      shot.height = 625;
      link.appendChild(shot);
    }
    link.appendChild(el('h3', '', project.name));
    link.appendChild(el('p', '', project.blurb));
    if (project.tech) link.appendChild(el('p', 'tech', project.tech));
    item.appendChild(link);
    return item;
  }

  function renderListed(project) {
    var item = el('li');
    var link = el('a', '', project.name);
    link.href = project.url;
    item.appendChild(link);
    if (project.blurb) item.appendChild(el('span', '', project.blurb));
    return item;
  }

  // Previous and next buttons, the "1 of 8" count, and arrow keys for the top projects row.
  function startCarousel() {
    var track = document.getElementById('featured');
    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    var count = document.getElementById('count');
    var slides = Array.prototype.slice.call(track.children);
    var current = 0;

    function show() {
      count.textContent = (current + 1) + ' of ' + slides.length;
      prev.disabled = current === 0;
      next.disabled = current === slides.length - 1;
    }

    function go(i) {
      var target = Math.max(0, Math.min(slides.length - 1, i));
      track.scrollTo({ left: slides[target].offsetLeft });
    }

    function nearest() {
      var best = 0;
      slides.forEach(function (slide, i) {
        if (Math.abs(slide.offsetLeft - track.scrollLeft) <
            Math.abs(slides[best].offsetLeft - track.scrollLeft)) best = i;
      });
      return best;
    }

    prev.addEventListener('click', function () { go(current - 1); });
    next.addEventListener('click', function () { go(current + 1); });

    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); }
    });

    track.addEventListener('scroll', function () {
      var found = nearest();
      if (found !== current) { current = found; show(); }
    }, { passive: true });

    show();
  }

  fetch('projects.json')
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (data) {
      var featured = document.getElementById('featured');
      var index = document.getElementById('index');

      data.projects
        .filter(function (p) { return p.status === 'featured'; })
        .forEach(function (p) { featured.appendChild(renderFeatured(p)); });

      if (featured.children.length) {
        document.getElementById('top').hidden = false;
        startCarousel();
      }

      data.groups.forEach(function (name) {
        var members = data.projects.filter(function (p) {
          return p.status === 'listed' && p.group === name;
        });
        if (!members.length) return;
        var group = el('section', 'group');
        var list = el('ul');
        group.appendChild(el('h3', '', name));
        members.forEach(function (p) { list.appendChild(renderListed(p)); });
        group.appendChild(list);
        index.appendChild(group);
      });

      document.getElementById('more').hidden = !index.children.length;
    })
    .catch(function () {
      var notice = document.getElementById('notice');
      notice.hidden = false;
      notice.innerHTML = 'The project list didn’t load. Reload the page, or browse the projects on <a href="https://github.com/Johnesco?tab=repositories">GitHub</a>.';
    });
</script>

</body>
</html>
